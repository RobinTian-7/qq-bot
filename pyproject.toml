[project]
name = "qq-agent"
version = "0.1.0"
description = "QQ 群日报 Bot：抓取老师消息 → 遍历链接网页 → DeepSeek / Codex 生成每日摘要"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "websockets>=13.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=5.0",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
qq-agent = "qq_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_agent"]
